<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 196" role="img" aria-label="Con la stessa domanda, il ruolo cambia stile e priorità della risposta, mentre le conoscenze del modello restano le stesse."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-role-prompting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-accent" x="20" y="24" width="150" height="40" rx="8"/><text class="t-sm mid it" x="95" y="49">Ruolo: tecnico</text><text class="t-sm mid en" x="95" y="49">Role: technician</text><rect class="box" x="20" y="80" width="150" height="40" rx="8"/><text class="t-sm mid it" x="95" y="105">Stessa domanda</text><text class="t-sm mid en" x="95" y="105">Same question</text><rect class="box-accent" x="20" y="136" width="150" height="40" rx="8"/><text class="t-sm mid it" x="95" y="161">Ruolo: maestro</text><text class="t-sm mid en" x="95" y="161">Role: teacher</text><line class="ln" x1="176" y1="46" x2="224" y2="86" marker-end="url(#ah-role-prompting)"/><line class="ln" x1="176" y1="100" x2="224" y2="100" marker-end="url(#ah-role-prompting)"/><line class="ln" x1="176" y1="154" x2="224" y2="114" marker-end="url(#ah-role-prompting)"/><rect class="box-mod" x="230" y="70" width="110" height="60" rx="8"/><text class="t mid it" x="285" y="105">Modello</text><text class="t mid en" x="285" y="105">Model</text><text class="t-xs mid it" x="285" y="150">stesse conoscenze</text><text class="t-xs mid en" x="285" y="150">same knowledge</text><line class="ln" x1="346" y1="88" x2="414" y2="48" marker-end="url(#ah-role-prompting)"/><line class="ln" x1="346" y1="112" x2="414" y2="152" marker-end="url(#ah-role-prompting)"/><rect class="box" x="420" y="24" width="120" height="40" rx="8"/><text class="t-sm mid it" x="480" y="49">Più tecnica</text><text class="t-sm mid en" x="480" y="49">More technical</text><rect class="box" x="420" y="132" width="120" height="40" rx="8"/><text class="t-sm mid it" x="480" y="157">Più semplice</text><text class="t-sm mid en" x="480" y="157">Simpler</text></svg>
