<text class="t mid en" x="335" y="89">Model</text>
<line class="ln" x1="398" y1="84" x2="442" y2="84" marker-end="url(#ah-zero-shot)"/>
<rect class="box" x="450" y="60" width="90" height="48" rx="8"/>
<text class="t mid it" x="495" y="89">Risposta</text>
