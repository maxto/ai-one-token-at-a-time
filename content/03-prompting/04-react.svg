<svg viewBox="0 0 560 210" role="img" aria-label="Il modello alterna pensiero, azione e osservazione: il programma esegue l'azione con lo strumento, e il ciclo si ripete finché le informazioni bastano.">
<defs>
<marker id="ah-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
</defs>
<rect class="box-accent" x="20" y="20" width="130" height="40" rx="8"/>
<text class="t mid it" x="85" y="45">Risposta</text>
<text class="t mid en" x="85" y="45">Answer</text>
<rect class="box" x="215" y="20" width="130" height="40" rx="8"/>
<text class="t mid it" x="280" y="45">Strumento</text>
<text class="t mid en" x="280" y="45">Tool</text>
<rect class="box-mod" x="20" y="100" width="130" height="44" rx="8"/>
<text class="t mid it" x="85" y="127">Pensiero</text>
<text class="t mid en" x="85" y="127">Thought</text>
<rect class="box-mod" x="215" y="100" width="130" height="44" rx="8"/>
<text class="t mid it" x="280" y="127">Azione</text>
<text class="t mid en" x="280" y="127">Action</text>
<rect class="box-mod" x="410" y="100" width="130" height="44" rx="8"/>
<text class="t mid it" x="475" y="127">Osservazione</text>
<text class="t mid en" x="475" y="127">Observation</text>
<line class="ln" x1="156" y1="122" x2="208" y2="122" marker-end="url(#ah-react)"/>
<line class="ln" x1="280" y1="96" x2="280" y2="66" marker-end="url(#ah-react)"/>
<text class="t-xs it" x="288" y="86">eseguita dal programma</text>
<text class="t-xs en" x="288" y="86">run by the program</text>
<path class="ln" d="M351,40 L475,40 L475,94" marker-end="url(#ah-react)"/>
<line class="ln" x1="85" y1="96" x2="85" y2="66" marker-end="url(#ah-react)"/>
<text class="t-xs it" x="93" y="86">se basta</text>
<text class="t-xs en" x="93" y="86">if enough</text>
<path class="ln dash" d="M475,150 L475,176 L85,176 L85,150" marker-end="url(#ah-react)"/>
<text class="t-xs mid it" x="280" y="196">ripete il ciclo</text>
<text class="t-xs mid en" x="280" y="196">repeats the loop</text>
</svg>
