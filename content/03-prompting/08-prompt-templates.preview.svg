<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="Il template tiene fisse le istruzioni; a ogni chiamata un programma riempie i segnaposto con i dati del caso e invia il prompt completo."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-prompt-templates" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm it" x="20" y="30">Dati</text><text class="t-sm en" x="20" y="30">Data</text><text class="t-sm" x="206" y="30">Template</text><rect class="box-soft" x="20" y="88" width="130" height="24" rx="5"/><text class="t-sm t-mono" x="32" y="105">Dune</text><rect class="box-soft" x="20" y="118" width="130" height="24" rx="5"/><text class="t-sm it" x="32" y="135">“Bello ma lungo”</text><text class="t-sm en" x="32" y="135">“Great but long”</text><text class="t-xs mid it" x="178" y="80">riempie</text><text class="t-xs mid en" x="178" y="80">fills</text><line class="ln" x1="154" y1="100" x2="200" y2="100" marker-end="url(#ah-prompt-templates)"/><line class="ln" x1="154" y1="130" x2="200" y2="130" marker-end="url(#ah-prompt-templates)"/><rect class="box" x="206" y="40" width="192" height="110" rx="8"/><rect class="box-soft" x="218" y="52" width="168" height="28" rx="5"/><text class="t-sm mid it" x="302" y="71">Istruzioni fisse</text><text class="t-sm mid en" x="302" y="71">Fixed instructions</text><rect class="box-accent" x="218" y="88" width="168" height="24" rx="5"/><text class="t-sm t-mono mid it" x="302" y="105">{titolo}</text><text class="t-sm t-mono mid en" x="302" y="105">{title}</text><rect class="box-accent" x="218" y="118" width="168" height="24" rx="5"/><text class="t-sm t-mono mid it" x="302" y="135">{recensione}</text><text class="t-sm t-mono mid en" x="302" y="135">{review}</text><line class="ln" x1="404" y1="95" x2="446" y2="95" marker-end="url(#ah-prompt-templates)"/><text class="t-xs mid" x="425" y="86">prompt</text><rect class="box-mod" x="452" y="71" width="88" height="48" rx="8"/><text class="t mid it" x="496" y="100">Modello</text><text class="t mid en" x="496" y="100">Model</text></svg>
