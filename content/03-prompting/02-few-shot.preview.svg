<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 204" role="img" aria-label="Tre esempi completi mostrano lo schema; per il caso nuovo il modello continua lo stesso schema, senza cambiare i suoi pesi."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-few-shot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm" x="20" y="22">Prompt</text><rect class="box" x="20" y="32" width="250" height="158" rx="8"/><rect class="box-soft" x="36" y="60" width="218" height="26" rx="5"/><text class="t t-mono" x="52" y="78">3 kg</text><line class="ln-muted" x1="112" y1="73" x2="148" y2="73" marker-end="url(#ah-few-shot)"/><text class="t t-mono" x="160" y="78">3000 g</text><rect class="box-soft" x="36" y="92" width="218" height="26" rx="5"/><text class="t t-mono" x="52" y="110">1 kg</text><line class="ln-muted" x1="112" y1="105" x2="148" y2="105" marker-end="url(#ah-few-shot)"/><text class="t t-mono" x="160" y="110">1000 g</text><rect class="box-soft" x="36" y="124" width="218" height="26" rx="5"/><text class="t t-mono" x="52" y="142">5 kg</text><line class="ln-muted" x1="112" y1="137" x2="148" y2="137" marker-end="url(#ah-few-shot)"/><text class="t t-mono" x="160" y="142">5000 g</text><rect class="box-accent" x="36" y="156" width="218" height="26" rx="5"/><text class="t t-mono" x="52" y="174">2 kg</text><line class="ln-muted" x1="112" y1="169" x2="148" y2="169" marker-end="url(#ah-few-shot)"/><text class="t t-mono t-accent" x="160" y="174">?</text><text class="t-xs it" x="36" y="52">esempi</text><text class="t-xs en" x="36" y="52">examples</text><line class="ln" x1="278" y1="169" x2="322" y2="169" marker-end="url(#ah-few-shot)"/><rect class="box-mod" x="330" y="145" width="100" height="48" rx="8"/><text class="t mid it" x="380" y="174">Modello</text><text class="t mid en" x="380" y="174">Model</text><text class="t-xs mid it" x="380" y="130">imita lo schema</text><text class="t-xs mid en" x="380" y="130">copies the pattern</text><line class="ln" x1="438" y1="169" x2="470" y2="169" marker-end="url(#ah-few-shot)"/><rect class="box" x="476" y="145" width="64" height="48" rx="8"/>