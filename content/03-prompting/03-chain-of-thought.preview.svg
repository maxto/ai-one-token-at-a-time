<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 196" role="img" aria-label="Saltando i passaggi il conto si sbaglia facilmente, mentre scrivendo i risultati intermedi ogni passo si appoggia sul precedente."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-chain-of-thought" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm it" x="20" y="28">Risposta diretta</text><text class="t-sm en" x="20" y="28">Direct answer</text><rect class="box" x="20" y="42" width="180" height="36" rx="6"/><text class="t-sm t-mono mid" x="110" y="65">8:40 + 2:35 + 0:20</text><line class="ln-muted dash" x1="206" y1="60" x2="464" y2="60" marker-end="url(#ah-chain-of-thought)"/><text class="t-xs mid it" x="335" y="52">salta i passaggi</text><text class="t-xs mid en" x="335" y="52">skips the steps</text><rect class="box-soft" x="470" y="42" width="70" height="36" rx="6"/><text class="t-sm t-mono mid" x="505" y="65">11:15</text><text class="t-xs mid it" x="505" y="94">sbagliata</text><text class="t-xs mid en" x="505" y="94">wrong</text><text class="t-sm it" x="20" y="120">Passo per passo</text><text class="t-sm en" x="20" y="120">Step by step</text><rect class="box" x="20" y="134" width="130" height="36" rx="6"/><text class="t-sm t-mono mid" x="85" y="157">8:40 + 2:35</text><line class="ln" x1="156" y1="152" x2="184" y2="152" marker-end="url(#ah-chain-of-thought)"/><rect class="box" x="190" y="134" width="80" height="36" rx="6"/><text class="t-sm t-mono mid" x="230" y="157">11:15</text><line class="ln" x1="276" y1="152" x2="304" y2="152" marker-end="url(#ah-chain-of-thought)"/><rect class="box" x="310" y="134" width="80" height="36" rx="6"/><text class="t-sm t-mono mid" x="350" y="157">+ 0:20</text><line class="ln" x1="396" y1="152" x2="464" y2="152" marker-end="url(#ah-chain-of-thought)"/><rect class="box-accent" x="470" y="134" width="70" height="36" rx="6"/><text class="t-sm t-mono mid" x="505" y="157">11:35</text><text class="t-xs mid it" x="505" y="186">giusta</text><text class="t-xs mid en" x="505" y="186">right</text></svg>
