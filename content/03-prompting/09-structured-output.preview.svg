<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 196" role="img" aria-label="Con la sola richiesta nel prompt il JSON può arrivare rotto, la decodifica vincolata impone lo schema, ma i valori vanno comunque controllati."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-structured-output" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="20" y="24" width="130" height="44" rx="6"/><text class="t-sm mid" x="85" y="42">prompt</text><text class="t-sm mid it" x="85" y="60">chiede JSON</text><text class="t-sm mid en" x="85" y="60">asks for JSON</text><line class="ln" x1="152" y1="46" x2="176" y2="46" marker-end="url(#ah-structured-output)"/><rect class="box" x="180" y="24" width="120" height="44" rx="6"/><text class="t mid it" x="240" y="51">modello</text><text class="t mid en" x="240" y="51">model</text><line class="ln" x1="302" y1="46" x2="326" y2="46" marker-end="url(#ah-structured-output)"/><text class="t-sm t-mono it" x="336" y="51">Ecco: {"anno": 1990</text><text class="t-sm t-mono en" x="336" y="51">Here: {"year": 1990</text><text class="t-xs it" x="336" y="74">formato rotto</text><text class="t-xs en" x="336" y="74">broken format</text><line class="ln-muted dash" x1="20" y1="94" x2="540" y2="94"/><rect class="box" x="20" y="114" width="130" height="44" rx="6"/><text class="t-sm mid" x="85" y="132">prompt</text><text class="t-sm mid" x="85" y="150">+ schema</text><line class="ln" x1="152" y1="136" x2="176" y2="136" marker-end="url(#ah-structured-output)"/><rect class="box-accent" x="180" y="114" width="120" height="44" rx="6"/><text class="t-sm mid it" x="240" y="132">modello</text><text class="t-sm mid it" x="240" y="150">+ vincolo</text><text class="t-sm mid en" x="240" y="132">model</text><text class="t-sm mid en" x="240" y="150">+ constraint</text><line class="ln" x1="302" y1="136" x2="326" y2="136" marker-end="url(#ah-structured-output)"/><text class="t-sm t-mono it" x="336" y="141">{"anno": 1990}</text><text class="t-sm t-mono en" x="336" y="141">{"year": 1990}</text><text class="t-xs it" x="336" y="164">formato vincolato</text><text class="t-xs en" x="336" y="164">constrained format</text><text class="t-xs t-accent it" x="336" y="182">valore da controllare</text><text class="t-xs t-accent en" x="336" y="182">value still to check</text></svg>
