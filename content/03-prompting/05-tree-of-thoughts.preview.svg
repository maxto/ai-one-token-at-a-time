<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" role="img" aria-label="A ogni bivio nascono più passi alternativi; il modello li valuta, i rami deboli vengono scartati e si espande solo quello promettente."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-tree-of-thoughts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-tree-of-thoughts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><rect class="box" x="20" y="95" width="110" height="40" rx="8"/><text class="t mid it" x="75" y="120">Problema</text><text class="t mid en" x="75" y="120">Problem</text><rect class="box-soft" x="200" y="30" width="90" height="36" rx="6"/><text class="t t-mono mid" x="245" y="53">0.2</text><rect class="box" x="200" y="97" width="90" height="36" rx="6"/><text class="t t-mono mid" x="245" y="120">0.7</text><rect class="box-soft" x="200" y="164" width="90" height="36" rx="6"/><text class="t t-mono mid" x="245" y="187">0.5</text><line class="ln-muted" x1="130" y1="115" x2="194" y2="48" marker-end="url(#ah-tree-of-thoughts)"/><line class="ln-accent" x1="130" y1="115" x2="194" y2="115" marker-end="url(#ah2-tree-of-thoughts)"/><line class="ln-muted" x1="130" y1="115" x2="194" y2="182" marker-end="url(#ah-tree-of-thoughts)"/><text class="t-xs it" x="298" y="52">scartato</text><text class="t-xs en" x="298" y="52">pruned</text><text class="t-xs it" x="298" y="186">scartato</text><text class="t-xs en" x="298" y="186">pruned</text><rect class="box-soft" x="400" y="62" width="90" height="36" rx="6"/><text class="t t-mono mid" x="445" y="85">0.3</text><rect class="box-accent" x="400" y="132" width="90" height="36" rx="6"/><text class="t t-mono mid" x="445" y="155">0.9</text><line class="ln-muted" x1="290" y1="115" x2="394" y2="80" marker-end="url(#ah-tree-of-thoughts)"/><line class="ln-accent" x1="290" y1="115" x2="394" y2="150" marker-end="url(#ah2-tree-of-thoughts)"/><text class="t-xs it" x="498" y="84">scartato</text><text class="t-xs en" x="498" y="84">pruned</text><text class="t-xs t-accent it" x="498" y="154">scelto</text><text class="t-xs t-accent en" x="498" y="154">chosen</text><text class="t-xs it" x="20" y="222">numeri = voto del modello su ogni ramo</text><text class="t-xs en" x="20" y="222">numbers = the model's score for each branch</text></svg>
