<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-label="Il modello alterna pensiero, azione e osservazione; il programma esegue l'azione con lo strumento, e il ciclo si ripete finché le informazioni bastano."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d9eff2;stroke:#1098ad;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#1098ad}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#1098ad;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#1098ad}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-react" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-accent" x="20" y="20" width="130" height="40" rx="8"/><text class="t mid it" x="85" y="45">Risposta</text><text class="t mid en" x="85" y="45">Answer</text><rect class="box" x="215" y="20" width="130" height="40" rx="8"/><text class="t mid it" x="280" y="45">Strumento</text><text class="t mid en" x="280" y="45">Tool</text><rect class="box-mod" x="20" y="100" width="130" height="44" rx="8"/><text class="t mid it" x="85" y="127">Pensiero</text><text class="t mid en" x="85" y="127">Thought</text><rect class="box-mod" x="215" y="100" width="130" height="44" rx="8"/><text class="t mid it" x="280" y="127">Azione</text><text class="t mid en" x="280" y="127">Action</text><rect class="box-mod" x="410" y="100" width="130" height="44" rx="8"/><text class="t mid it" x="475" y="127">Osservazione</text><text class="t mid en" x="475" y="127">Observation</text><line class="ln" x1="156" y1="122" x2="208" y2="122" marker-end="url(#ah-react)"/><line class="ln" x1="280" y1="96" x2="280" y2="66" marker-end="url(#ah-react)"/><text class="t-xs it" x="288" y="86">eseguita dal programma</text><text class="t-xs en" x="288" y="86">run by the program</text><path class="ln" d="M351,40 L475,40 L475,94" marker-end="url(#ah-react)"/><line class="ln" x1="85" y1="96" x2="85" y2="66" marker-end="url(#ah-react)"/><text class="t-xs it" x="93" y="86">se basta</text><text class="t-xs en" x="93" y="86">if enough</text><path class="ln dash" d="M475,150 L475,176 L85,176 L85,150" marker-end="url(#ah-react)"/><text class="t-xs mid it" x="280" y="196">ripete il ciclo</text><text class="t-xs mid en" x="280" y="196">repeats the loop</text></svg>
