<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="In questo esempio di delega, B riceve da A solo la consegna scritta e restituisce un risultato breve."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-handoffs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="20" y="30" width="170" height="130" rx="6"/><text class="t-sm t-b mid it" x="105" y="52">Agente A</text><text class="t-sm t-b mid en" x="105" y="52">Agent A</text><rect class="fill-soft" x="36" y="66" width="138" height="8" rx="4"/><rect class="fill-soft" x="36" y="84" width="138" height="8" rx="4"/><rect class="fill-soft" x="36" y="102" width="138" height="8" rx="4"/><rect class="fill-soft" x="36" y="120" width="138" height="8" rx="4"/><rect class="fill-soft" x="36" y="138" width="138" height="8" rx="4"/><text class="t-sm mid it" x="290" y="36">consegna</text><text class="t-sm mid en" x="290" y="36">brief</text><rect class="box-accent" x="225" y="45" width="130" height="105" rx="6"/><text class="t-xs mid it" x="290" y="66">obiettivo</text><text class="t-xs mid en" x="290" y="66">goal</text><text class="t-xs mid it" x="290" y="83">fatto finora</text><text class="t-xs mid en" x="290" y="83">done so far</text><text class="t-xs mid it" x="290" y="100">vincoli</text><text class="t-xs mid en" x="290" y="100">constraints</text><text class="t-xs mid it" x="290" y="117">formato</text><text class="t-xs mid en" x="290" y="117">format</text><text class="t-xs mid it" x="290" y="134">quando fermarsi</text><text class="t-xs mid en" x="290" y="134">when to stop</text><rect class="box" x="390" y="30" width="150" height="130" rx="6"/><text class="t-sm t-b mid it" x="465" y="52">Agente B</text><text class="t-sm t-b mid en" x="465" y="52">Agent B</text><text class="t-xs mid it" x="465" y="96">vede solo</text><text class="t-xs mid en" x="465" y="96">sees only</text><text class="t-xs mid it" x="465" y="112">la consegna</text><text class="t-xs mid en" x="465" y="112">the brief</text><line class="ln" x1="190" y1="97" x2="223" y2="97" marker-end="url(#ah-handoffs)"/><line class="ln" x1="355" y1="97" x2="388" y2="97" marker-end="url(#ah-handoffs)"/><polyline class="ln-muted dash" points="465,160 465,188 105,188 105,162" marker-end="url(#ah-handoffs)"/><text class="t-xs mid it" x="290" y="180">risultato breve</text><text class="t-xs mid en" x="290" y="180">short result</text></svg>
