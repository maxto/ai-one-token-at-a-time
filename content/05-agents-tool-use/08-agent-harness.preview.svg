<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="L'harness avvolge il modello: prepara il contesto, controlla i permessi prima di ogni azione e riporta il risultato degli strumenti nel contesto."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-agent-harness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-accent" x="20" y="20" width="380" height="210" rx="10"/><text class="t t-b t-accent" x="36" y="44">harness</text><rect class="box" x="40" y="62" width="150" height="56" rx="6"/><text class="t mid it" x="115" y="86">Contesto</text><text class="t mid en" x="115" y="86">Context</text><text class="t-xs mid it" x="115" y="106">istruzioni, risultati</text><text class="t-xs mid en" x="115" y="106">instructions, results</text><rect class="box" x="230" y="62" width="150" height="56" rx="6"/><text class="t mid it" x="305" y="95">Modello</text><text class="t mid en" x="305" y="95">Model</text><line class="ln" x1="190" y1="90" x2="228" y2="90" marker-end="url(#ah-agent-harness)"/><rect class="box" x="230" y="160" width="150" height="40" rx="6"/><text class="t mid it" x="305" y="185">Permessi</text><text class="t mid en" x="305" y="185">Permissions</text><line class="ln" x1="305" y1="118" x2="305" y2="158" marker-end="url(#ah-agent-harness)"/><text class="t-xs it" x="313" y="143">richiesta</text><text class="t-xs en" x="313" y="143">request</text><rect class="box" x="430" y="160" width="110" height="40" rx="6"/><text class="t mid it" x="485" y="185">Strumenti</text><text class="t mid en" x="485" y="185">Tools</text><line class="ln" x1="380" y1="180" x2="428" y2="180" marker-end="url(#ah-agent-harness)"/><text class="t-xs mid" x="416" y="172">ok</text><polyline class="ln" points="485,200 485,250 115,250 115,120" marker-end="url(#ah-agent-harness)"/><text class="t-xs mid it" x="300" y="266">risultato</text><text class="t-xs mid en" x="300" y="266">result</text></svg>
