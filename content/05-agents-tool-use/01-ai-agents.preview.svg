<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Il modello sceglie un'azione, lo strumento la esegue e il risultato torna al modello, finché il compito è finito."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-ai-agents" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="20" y="40" width="120" height="40" rx="6"/><text class="t mid it" x="80" y="65">Obiettivo</text><text class="t mid en" x="80" y="65">Goal</text><rect class="box-accent" x="220" y="40" width="120" height="40" rx="6"/><text class="t mid it" x="280" y="65">Modello</text><text class="t mid en" x="280" y="65">Model</text><rect class="box" x="420" y="40" width="120" height="40" rx="6"/><text class="t mid it" x="480" y="65">Risposta</text><text class="t mid en" x="480" y="65">Answer</text><rect class="box" x="220" y="140" width="120" height="40" rx="6"/><text class="t mid it" x="280" y="165">Strumento</text><text class="t mid en" x="280" y="165">Tool</text><line class="ln" x1="140" y1="60" x2="218" y2="60" marker-end="url(#ah-ai-agents)"/><line class="ln" x1="340" y1="60" x2="418" y2="60" marker-end="url(#ah-ai-agents)"/><text class="t-xs mid it" x="379" y="50">finito</text><text class="t-xs mid en" x="379" y="50">done</text><line class="ln" x1="255" y1="80" x2="255" y2="138" marker-end="url(#ah-ai-agents)"/><text class="t-xs end it" x="247" y="114">azione</text><text class="t-xs end en" x="247" y="114">action</text><line class="ln" x1="305" y1="140" x2="305" y2="82" marker-end="url(#ah-ai-agents)"/><text class="t-xs it" x="313" y="114">risultato</text><text class="t-xs en" x="313" y="114">result</text></svg>
