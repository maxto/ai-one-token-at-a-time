<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="Dopo ogni azione una verifica decide: se passa il lavoro è finito, se fallisce si riprova fino a un limite, poi si chiede a una persona."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-agent-loops" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="20" y="80" width="110" height="40" rx="6"/><text class="t mid it" x="75" y="105">Agisci</text><text class="t mid en" x="75" y="105">Act</text><rect class="box-accent" x="180" y="80" width="120" height="40" rx="6"/><text class="t mid it" x="240" y="105">Verifica</text><text class="t mid en" x="240" y="105">Check</text><rect class="box" x="410" y="20" width="130" height="40" rx="6"/><text class="t mid it" x="475" y="45">Fatto</text><text class="t mid en" x="475" y="45">Done</text><rect class="box" x="410" y="140" width="130" height="40" rx="6"/><text class="t mid it" x="475" y="165">Chiedi aiuto</text><text class="t mid en" x="475" y="165">Ask a human</text><line class="ln" x1="130" y1="100" x2="178" y2="100" marker-end="url(#ah-agent-loops)"/><line class="ln" x1="300" y1="92" x2="408" y2="40" marker-end="url(#ah-agent-loops)"/><text class="t-xs end" x="345" y="62">ok</text><line class="ln" x1="300" y1="108" x2="408" y2="160" marker-end="url(#ah-agent-loops)"/><text class="t-xs end it" x="348" y="154">3 errori</text><text class="t-xs end en" x="348" y="154">3 fails</text><polyline class="ln" points="240,120 240,170 75,170 75,122" marker-end="url(#ah-agent-loops)"/><text class="t-xs mid it" x="157" y="162">riprova (max 3)</text><text class="t-xs mid en" x="157" y="162">retry (max 3)</text></svg>
