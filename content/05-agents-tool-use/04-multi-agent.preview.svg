<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 222" role="img" aria-label="L'orchestratore assegna un compito a ogni sotto-agente, che lavora nel proprio contesto e restituisce solo una sintesi."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-multi-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-accent" x="170" y="20" width="220" height="40" rx="6"/><text class="t mid it" x="280" y="45">Orchestratore</text><text class="t mid en" x="280" y="45">Orchestrator</text><rect class="box" x="30" y="150" width="140" height="40" rx="6"/><text class="t mid it" x="100" y="175">Ricerca</text><text class="t mid en" x="100" y="175">Research</text><text class="t-xs mid it" x="100" y="210">contesto proprio</text><text class="t-xs mid en" x="100" y="210">own context</text><rect class="box" x="210" y="150" width="140" height="40" rx="6"/><text class="t mid it" x="280" y="175">Scrittura</text><text class="t mid en" x="280" y="175">Writing</text><text class="t-xs mid it" x="280" y="210">contesto proprio</text><text class="t-xs mid en" x="280" y="210">own context</text><rect class="box" x="390" y="150" width="140" height="40" rx="6"/><text class="t mid it" x="460" y="175">Verifica</text><text class="t mid en" x="460" y="175">Review</text><text class="t-xs mid it" x="460" y="210">contesto proprio</text><text class="t-xs mid en" x="460" y="210">own context</text><line class="ln" x1="200" y1="60" x2="85" y2="148" marker-end="url(#ah-multi-agent)"/><line class="ln-muted dash" x1="115" y1="150" x2="230" y2="62" marker-end="url(#ah-multi-agent)"/><line class="ln" x1="265" y1="60" x2="265" y2="148" marker-end="url(#ah-multi-agent)"/><line class="ln-muted dash" x1="295" y1="150" x2="295" y2="62" marker-end="url(#ah-multi-agent)"/><line class="ln" x1="330" y1="60" x2="445" y2="148" marker-end="url(#ah-multi-agent)"/><line class="ln-muted dash" x1="475" y1="150" x2="360" y2="62" marker-end="url(#ah-multi-agent)"/><text class="t-xs end it" x="257" y="108">compito</text><text class="t-xs end en" x="257" y="108">task</text><text class="t-xs it" x="303" y="108">sintesi</text><text class="t-xs en" x="303" y="108">summary</text></svg>
