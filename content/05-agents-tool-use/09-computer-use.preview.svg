<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Il modello riceve osservazioni dell'interfaccia, come screenshot o struttura della pagina, e richiede azioni che l'harness esegue prima di restituirne gli esiti."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-computer-use" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="30" y="30" width="200" height="170" rx="8"/><line class="ln-muted" x1="30" y1="58" x2="230" y2="58"/><text class="t-sm it" x="44" y="49">Interfaccia</text><text class="t-sm en" x="44" y="49">Interface</text><rect class="box-soft" x="50" y="76" width="160" height="32" rx="4"/><text class="t-sm t-mono" x="62" y="97">10:00</text><rect class="box-accent" x="50" y="128" width="100" height="34" rx="6"/><text class="t mid it" x="100" y="150">Salva</text><text class="t mid en" x="100" y="150">Save</text><rect class="box" x="390" y="85" width="150" height="60" rx="6"/><text class="t mid it" x="465" y="120">Modello</text><text class="t mid en" x="465" y="120">Model</text><line class="ln" x1="232" y1="100" x2="388" y2="100" marker-end="url(#ah-computer-use)"/><text class="t-sm t-b mid it" x="310" y="72">osserva</text><text class="t-sm t-b mid en" x="310" y="72">observes</text><text class="t-xs mid it" x="310" y="89">screenshot o struttura</text><text class="t-xs mid en" x="310" y="89">screenshot or structure</text><line class="ln" x1="388" y1="130" x2="232" y2="130" marker-end="url(#ah-computer-use)"/><text class="t-sm t-b mid it" x="310" y="152">richiede azione</text><text class="t-sm t-b mid en" x="310" y="152">requests action</text><text class="t-xs mid it" x="310" y="169">clic, tasti, testo</text><text class="t-xs mid it" x="310" y="185">eseguita dall'harness</text><text class="t-xs mid en" x="310" y="169">click, keys, text</text><text class="t-xs mid en" x="310" y="185">run by the harness</text></svg>
