<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Il modello legge solo la finestra di contesto; la memoria a lungo termine sta fuori, e il sistema salva e recupera note."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fee7d7;stroke:#f76707;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#f76707}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#f76707;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#f76707}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-agent-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-soft" x="20" y="20" width="230" height="150" rx="8"/><text class="t-sm t-b mid it" x="135" y="42">Finestra di contesto</text><text class="t-sm t-b mid en" x="135" y="42">Context window</text><rect class="box" x="36" y="56" width="198" height="28" rx="6"/><text class="t-sm mid it" x="135" y="75">conversazione</text><text class="t-sm mid en" x="135" y="75">conversation</text><rect class="box" x="36" y="92" width="198" height="28" rx="6"/><text class="t-sm mid it" x="135" y="111">risultati strumenti</text><text class="t-sm mid en" x="135" y="111">tool results</text><rect class="box-mod" x="36" y="128" width="198" height="28" rx="6"/><text class="t-sm mid it" x="135" y="147">note recuperate</text><text class="t-sm mid en" x="135" y="147">retrieved notes</text><rect class="box" x="330" y="20" width="210" height="40" rx="6"/><text class="t mid it" x="435" y="45">Modello</text><text class="t mid en" x="435" y="45">Model</text><rect class="box-accent" x="330" y="130" width="210" height="40" rx="6"/><text class="t mid it" x="435" y="155">Memoria esterna</text><text class="t mid en" x="435" y="155">External memory</text><line class="ln" x1="250" y1="40" x2="328" y2="40" marker-end="url(#ah-agent-memory)"/><text class="t-xs mid it" x="290" y="32">legge</text><text class="t-xs mid en" x="290" y="32">reads</text><line class="ln" x1="435" y1="60" x2="435" y2="128" marker-end="url(#ah-agent-memory)"/><text class="t-xs it" x="443" y="98">salva</text><text class="t-xs en" x="443" y="98">saves</text><line class="ln" x1="330" y1="150" x2="252" y2="150" marker-end="url(#ah-agent-memory)"/><text class="t-xs mid it" x="291" y="168">recupera</text><text class="t-xs mid en" x="291" y="168">retrieves</text></svg>
