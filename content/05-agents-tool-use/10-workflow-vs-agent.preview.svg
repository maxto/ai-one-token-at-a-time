</style><defs><marker id="ah-workflow-vs-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm t-b" x="30" y="28">Workflow</text><rect class="box" x="30" y="44" width="190" height="36" rx="6"/><text class="t-sm mid it" x="125" y="67">1. classifica</text><text class="t-sm mid en" x="125" y="67">1. sort</text><line class="ln" x1="125" y1="82" x2="125" y2="100" marker-end="url(#ah-workflow-vs-agent)"/><rect class="box" x="30" y="104" width="190" height="36" rx="6"/><text class="t-sm mid it" x="125" y="127">2. scrivi</text><text class="t-sm mid en" x="125" y="127">2. write</text><line class="ln" x1="125" y1="142" x2="125" y2="160" marker-end="url(#ah-workflow-vs-agent)"/><rect class="box" x="30" y="164" width="190" height="36" rx="6"/><text class="t-sm mid it" x="125" y="187">3. controlla</text><text class="t-sm mid en" x="125" y="187">3. check</text><text class="t-xs mid it" x="125" y="220">ordine fisso nel codice</text><text class="t-xs mid en" x="125" y="220">order fixed in code</text><line class="ln-muted dash" x1="268" y1="20" x2="268" y2="210"/><text class="t-sm t-b it" x="310" y="28">Agente</text><text class="t-sm t-b en" x="310" y="28">Agent</text><rect class="box-accent" x="310" y="104" width="110" height="36" rx="6"/><text class="t-sm mid it" x="365" y="127">modello</text><text class="t-sm mid en" x="365" y="127">model</text><rect class="box" x="468" y="44" width="72" height="36" rx="6"/><text class="t-sm mid it" x="504" y="67">cerca</text><text class="t-sm mid en" x="504" y="67">search</text><rect class="box" x="468" y="104" width="72" height="36" rx="6"/><text class="t-sm mid it" x="504" y="127">leggi</text><text class="t-sm mid en" x="504" y="127">read</text><rect class="box" x="468" y="164" width="72" height="36" rx="6"/><text class="t-sm mid it" x="504" y="187">prova</text><text class="t-sm mid en" x="504" y="187">test</text><line class="ln" x1="424" y1="116" x2="464" y2="66" marker-start="url(#ah-workflow-vs-agent)" marker-end="url(#ah-workflow-vs-agent)"/><line class="ln" x1="424" y1="122" x2="464" y2="122" marker-start="url(#ah-workflow-vs-agent)" marker-end="url(#ah-workflow-vs-agent)"/><line class="ln" x1="424" y1="128" x2="464" y2="178" marker-start="url(#ah-workflow-vs-agent)" marker-end="url(#ah-workflow-vs-agent)"/><line class="ln" x1="365" y1="142" x2="365" y2="160" marker-end="url(#ah-workflow-vs-agent)"/><rect class="box" x="310" y="164" width="110" height="36" rx="6"/><text class="t-sm mid it" x="365" y="187">fatto?</text><text class="t-sm mid en" x="365" y="187">done?</text><polyline class="ln" points="310,182 294,182 294,122 306,122" marker-end="url(#ah-workflow-vs-agent)"/><text class="t-xs end" x="290" y="156">no</text><text class="t-xs mid it" x="420" y="220">il modello sceglie il passo</text><text class="t-xs mid en" x="420" y="220">the model picks the step</text></svg>
