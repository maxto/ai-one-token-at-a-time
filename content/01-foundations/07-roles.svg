<svg viewBox="0 0 560 226" role="img" aria-label="I messaggi con i loro ruoli diventano un unico testo, separato da token speciali; il modello continua dal punto in cui tocca all'assistente.">
<defs>
<marker id="ah-roles" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
</defs>
<rect class="box-accent" x="20" y="24" width="230" height="36" rx="6"/>
<text class="t-sm it" x="34" y="47"><tspan class="t-b">system</tspan>  regole, tono</text>
<text class="t-sm en" x="34" y="47"><tspan class="t-b">system</tspan>  rules, tone</text>
<rect class="box" x="20" y="74" width="230" height="36" rx="6"/>
<text class="t-sm it" x="34" y="97"><tspan class="t-b">user</tspan>  domanda</text>
<text class="t-sm en" x="34" y="97"><tspan class="t-b">user</tspan>  question</text>
<rect class="box-mod" x="20" y="124" width="230" height="36" rx="6"/>
<text class="t-sm it" x="34" y="147"><tspan class="t-b">assistant</tspan>  risposta</text>
<text class="t-sm en" x="34" y="147"><tspan class="t-b">assistant</tspan>  reply</text>
<rect class="box" x="20" y="174" width="230" height="36" rx="6"/>
<text class="t-sm it" x="34" y="197"><tspan class="t-b">user</tspan>  nuova domanda</text>
<text class="t-sm en" x="34" y="197"><tspan class="t-b">user</tspan>  new question</text>
<line class="ln" x1="262" y1="117" x2="306" y2="117" marker-end="url(#ah-roles)"/>
<text class="t-xs mid it" x="284" y="106">diventa</text>
<text class="t-xs mid en" x="284" y="106">becomes</text>
<rect class="box-soft" x="318" y="24" width="222" height="186" rx="8"/>
<text class="t-sm t-mono it" x="334" y="54">&lt;sys&gt; regole, tono</text>
<text class="t-sm t-mono en" x="334" y="54">&lt;sys&gt; rules, tone</text>
<text class="t-sm t-mono it" x="334" y="82">&lt;user&gt; domanda</text>
<text class="t-sm t-mono en" x="334" y="82">&lt;user&gt; question</text>
<text class="t-sm t-mono it" x="334" y="110">&lt;asst&gt; risposta</text>
<text class="t-sm t-mono en" x="334" y="110">&lt;asst&gt; reply</text>
<text class="t-sm t-mono it" x="334" y="138">&lt;user&gt; nuova…</text>
<text class="t-sm t-mono en" x="334" y="138">&lt;user&gt; new…</text>
<text class="t-sm t-mono t-accent t-b" x="334" y="166">&lt;asst&gt; ▌</text>
<text class="t-xs mid it" x="429" y="198">un unico testo</text>
<text class="t-xs mid en" x="429" y="198">one single text</text>
</svg>
