<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" role="img" aria-label="La similarità del coseno guarda l'angolo tra i vettori: il documento che punta quasi come la domanda ottiene il punteggio più alto."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#e1e6fc;stroke:#4263eb;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#4263eb}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#4263eb;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#4263eb}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-vector-similarity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-vector-similarity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><line class="ln" x1="60" y1="175" x2="270" y2="125" stroke-width="2" marker-end="url(#ah-vector-similarity)"/><text class="t-sm" x="278" y="132">doc A</text><line class="ln" x1="60" y1="175" x2="70" y2="40" stroke-width="2" marker-end="url(#ah-vector-similarity)"/><text class="t-sm" x="80" y="44">doc B</text><line class="ln-accent" x1="60" y1="175" x2="250" y2="80" stroke-width="3" marker-end="url(#ah2-vector-similarity)"/><text class="t-sm t-accent t-b it" x="258" y="78">domanda</text><text class="t-sm t-accent t-b en" x="258" y="78">question</text><circle class="fill-ink" cx="60" cy="175" r="4"/><text class="t-sm t-b it" x="340" y="40">similarità del coseno</text><text class="t-sm t-b en" x="340" y="40">cosine similarity</text><rect class="box-accent" x="340" y="56" width="200" height="40" rx="6"/><text class="t" x="356" y="81">doc A</text><text class="t t-b end it" x="524" y="81">0,97</text><text class="t t-b end en" x="524" y="81">0.97</text><rect class="box" x="340" y="106" width="200" height="40" rx="6"/><text class="t" x="356" y="131">doc B</text><text class="t end it" x="524" y="131">0,51</text><text class="t end en" x="524" y="131">0.51</text><text class="t-xs it" x="340" y="172">1 = stessa direzione</text><text class="t-xs en" x="340" y="172">1 = same direction</text><text class="t-xs it" x="340" y="190">0 = perpendicolari</text><text class="t-xs en" x="340" y="190">0 = perpendicular</text></svg>
