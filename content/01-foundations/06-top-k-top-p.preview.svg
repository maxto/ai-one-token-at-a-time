<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="Top-p 0,9 tiene i token più probabili fino al 90%, uno solo se il modello è sicuro e sei se è incerto, mentre top-k 3 ne tiene sempre tre."><rect width="100%" height="100%" fill="#fff"/><style>
