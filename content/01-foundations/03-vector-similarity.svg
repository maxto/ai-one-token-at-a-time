<svg viewBox="0 0 560 206" role="img" aria-label="La similarità del coseno guarda l'angolo tra i vettori: il documento che punta quasi come la domanda ottiene il punteggio più alto.">
<defs>
<marker id="ah-vector-similarity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
<marker id="ah2-vector-similarity" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-accent"/>
</marker>
</defs>
<line class="ln" x1="60" y1="175" x2="270" y2="125" stroke-width="2" marker-end="url(#ah-vector-similarity)"/>
<text class="t-sm" x="278" y="132">doc A</text>
<line class="ln" x1="60" y1="175" x2="70" y2="40" stroke-width="2" marker-end="url(#ah-vector-similarity)"/>
<text class="t-sm" x="80" y="44">doc B</text>
<line class="ln-accent" x1="60" y1="175" x2="250" y2="80" stroke-width="3" marker-end="url(#ah2-vector-similarity)"/>
<text class="t-sm t-accent t-b it" x="258" y="78">domanda</text>
<text class="t-sm t-accent t-b en" x="258" y="78">question</text>
<circle class="fill-ink" cx="60" cy="175" r="4"/>
<text class="t-sm t-b it" x="340" y="40">similarità del coseno</text>
<text class="t-sm t-b en" x="340" y="40">cosine similarity</text>
<rect class="box-accent" x="340" y="56" width="200" height="40" rx="6"/>
<text class="t" x="356" y="81">doc A</text>
<text class="t t-b end it" x="524" y="81">0,97</text>
<text class="t t-b end en" x="524" y="81">0.97</text>
<rect class="box" x="340" y="106" width="200" height="40" rx="6"/>
<text class="t" x="356" y="131">doc B</text>
<text class="t end it" x="524" y="131">0,51</text>
<text class="t end en" x="524" y="131">0.51</text>
<text class="t-xs it" x="340" y="172">1 = stessa direzione</text>
<text class="t-xs en" x="340" y="172">1 = same direction</text>
<text class="t-xs it" x="340" y="190">0 = perpendicolari</text>
<text class="t-xs en" x="340" y="190">0 = perpendicular</text>
</svg>
