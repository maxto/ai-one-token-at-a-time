 mid" x="463" y="198">tacos</text><rect class="fill-muted" x="494" y="168.3" width="34" height="11.7" rx="2"/><text class="t-xs mid" x="511" y="198">kebab</text><text class="t-xs mid it" x="280" y="224">probabilità del token successivo</text><text class="t-xs mid en" x="280" y="224">probability of the next token</text></svg>
