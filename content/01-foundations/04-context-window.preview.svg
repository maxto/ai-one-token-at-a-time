<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Regole, chat, documenti e risposta devono stare tutti nella stessa finestra di token: ciò che non ci sta viene tagliato."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#e1e6fc;stroke:#4263eb;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#4263eb}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#4263eb;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#4263eb}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-context-window" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm t-accent t-b it" x="128" y="36">finestra di contesto: N token al massimo</text><text class="t-sm t-accent t-b en" x="128" y="36">context window: N tokens at most</text><rect class="box-accent" x="128" y="48" width="412" height="60" rx="8"/><rect class="box" x="140" y="60" width="80" height="36" rx="6"/><text class="t-sm mid it" x="180" y="83">regole</text><text class="t-sm mid en" x="180" y="83">rules</text><rect class="box" x="226" y="60" width="110" height="36" rx="6"/><text class="t-sm mid" x="281" y="83">chat</text><rect class="box" x="342" y="60" width="100" height="36" rx="6"/><text class="t-sm mid it" x="392" y="83">documenti</text><text class="t-sm mid en" x="392" y="83">documents</text><rect class="box-mod" x="448" y="60" width="80" height="36" rx="6"/><text class="t-sm mid it" x="488" y="83">risposta</text><text class="t-sm mid en" x="488" y="83">reply</text><rect class="box-soft" x="16" y="60" width="100" height="36" rx="6"/><text class="t-sm mid it" x="66" y="83">chat vecchia</text><text class="t-sm mid en" x="66" y="83">old chat</text><text class="t-xs mid it" x="66" y="124">tagliata</text><text class="t-xs mid en" x="66" y="124">cut off</text><line class="ln-muted" x1="140" y1="124" x2="442" y2="124"/><text class="t-xs mid it" x="291" y="144">ingresso</text><text class="t-xs mid en" x="291" y="144">input</text><line class="ln-muted" x1="448" y1="124" x2="528" y2="124"/><text class="t-xs mid it" x="488" y="144">uscita</text><text class="t-xs mid en" x="488" y="144">output</text></svg>
