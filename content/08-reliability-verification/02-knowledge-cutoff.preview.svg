<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" role="img" aria-label="Un documento recente entra nel contesto insieme alla domanda e permette di usare informazioni successive al cutoff."><rect width="100%" height="100%" fill="#fff"/><style>
