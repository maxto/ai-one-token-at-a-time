<svg viewBox="0 0 560 248" role="img" aria-label="Il controllo passa dall&#x27;esistenza della fonte al passaggio preciso, distinguendo una possibilità da una conclusione dimostrata.">
<defs>
<marker id="ah-sources-citations" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
</defs>
<rect class="box" x="20" y="35" width="150" height="60" rx="7"/>
<text class="t-sm mid it" x="95.0" y="65.0">Affermazione</text>
<text class="t-sm mid en" x="95.0" y="65.0">Claim</text>
<text class="t-sm mid it" x="95.0" y="83.0">«Succede sempre»</text>
<text class="t-sm mid en" x="95.0" y="83.0">“Always happens”</text>
<line class="ln" x1="174" y1="65" x2="214" y2="65" marker-end="url(#ah-sources-citations)"/>
<rect class="box" x="220" y="35" width="145" height="60" rx="7"/>
<text class="t-sm mid it" x="292.5" y="70.0">Fonte esistente</text>
<text class="t-sm mid en" x="292.5" y="70.0">Real source</text>
<line class="ln" x1="369" y1="65" x2="405" y2="65" marker-end="url(#ah-sources-citations)"/>
<rect class="box" x="411" y="35" width="129" height="60" rx="7"/>
<text class="t-sm mid it" x="475.5" y="65.0">Passaggio</text>
<text class="t-sm mid en" x="475.5" y="65.0">Passage</text>
<text class="t-sm mid it" x="475.5" y="83.0">«Può succedere»</text>
<text class="t-sm mid en" x="475.5" y="83.0">“May happen”</text>
<line class="ln" x1="476" y1="99" x2="476" y2="166" marker-end="url(#ah-sources-citations)"/>
<line class="ln" x1="472" y1="166" x2="348" y2="166" marker-end="url(#ah-sources-citations)"/>
<rect class="box-accent" x="80" y="140" width="262" height="54" rx="7"/>
<text class="t-sm mid it" x="211.0" y="172.0">Non sostiene «sempre»</text>
<text class="t-sm mid en" x="211.0" y="172.0">Does not support “always”</text>
<text class="t-sm mid it" x="280" y="228">Esistenza e sostegno sono controlli diversi</text>
<text class="t-sm mid en" x="280" y="228">Existence and support are separate checks</text>
</svg>
