<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 272" role="img" aria-label="Una domanda orientata spinge verso la conferma, mentre una domanda neutrale porta il confronto su dati e criteri espliciti."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#e8e2fb;stroke:#7048e8;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#7048e8}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#7048e8;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#7048e8}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-sycophancy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm it" x="20" y="25">Domanda orientata</text><text class="t-sm en" x="20" y="25">Leading question</text><rect class="box" x="20" y="42" width="242" height="56" rx="7"/><text class="t-sm mid it" x="141.0" y="75.0">«È perfetto, vero?»</text><text class="t-sm mid en" x="141.0" y="75.0">“It is perfect, right?”</text><line class="ln" x1="266" y1="70" x2="306" y2="70" marker-end="url(#ah-sycophancy)"/><rect class="box" x="312" y="42" width="228" height="56" rx="7"/><text class="t-sm mid it" x="426.0" y="75.0">Pressione a confermare</text><text class="t-sm mid en" x="426.0" y="75.0">Pressure to agree</text><text class="t-sm it" x="20" y="145">Domanda neutrale</text><text class="t-sm en" x="20" y="145">Neutral question</text><rect class="box" x="20" y="162" width="242" height="56" rx="7"/><text class="t-sm mid it" x="141.0" y="195.0">«Confronta tempi e cambi»</text><text class="t-sm mid en" x="141.0" y="195.0">“Compare timing and changes”</text><line class="ln" x1="266" y1="190" x2="306" y2="190" marker-end="url(#ah-sycophancy)"/><rect class="box-accent" x="312" y="162" width="228" height="56" rx="7"/><text class="t-sm mid it" x="426.0" y="195.0">Dati + criteri</text><text class="t-sm mid en" x="426.0" y="195.0">Data + criteria</text><text class="t-sm mid it" x="280" y="251">Una formulazione migliore aiuta, non garantisce</text><text class="t-sm mid en" x="280" y="251">Better wording helps, but is no guarantee</text></svg>
