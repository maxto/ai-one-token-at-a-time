<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 243" role="img" aria-label="Dati con ruoli rappresentati in modo squilibrato possono portare il modello a ripetere la stessa associazione nelle storie generate."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#e8e2fb;stroke:#7048e8;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#7048e8}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#7048e8;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#7048e8}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-bias" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm mid it" x="111" y="27">Dati: esempio</text><text class="t-sm mid en" x="111" y="27">Data: example</text><rect class="box" x="20" y="44" width="182" height="60" rx="7"/><text class="t-sm mid it" x="111.0" y="79.0">medico: uomo</text><text class="t-sm mid en" x="111.0" y="79.0">doctor: man</text><rect class="box" x="20" y="116" width="182" height="60" rx="7"/><text class="t-sm mid it" x="111.0" y="151.0">medico: uomo</text><text class="t-sm mid en" x="111.0" y="151.0">doctor: man</text><line class="ln" x1="206" y1="110" x2="246" y2="110" marker-end="url(#ah-bias)"/><rect class="box" x="252" y="78" width="96" height="64" rx="7"/><text class="t-sm mid it" x="300.0" y="115.0">Modello</text><text class="t-sm mid en" x="300.0" y="115.0">Model</text><line class="ln" x1="352" y1="110" x2="386" y2="110" marker-end="url(#ah-bias)"/><text class="t-sm mid it" x="467" y="27">Possibile ripetizione</text><text class="t-sm mid en" x="467" y="27">Possible repetition</text><rect class="box-accent" x="392" y="44" width="150" height="60" rx="7"/><text class="t-sm mid it" x="467.0" y="79.0">medico: uomo</text><text class="t-sm mid en" x="467.0" y="79.0">doctor: man</text><rect class="box" x="392" y="116" width="150" height="60" rx="7"/><text class="t-sm mid it" x="467.0" y="151.0">medico: uomo</text><text class="t-sm mid en" x="467.0" y="151.0">doctor: man</text><text class="t-sm mid it" x="280" y="222">Conta anche la varietà dei ruoli rappresentati</text><text class="t-sm mid en" x="280" y="222">Variety in the roles represented matters too</text></svg>
