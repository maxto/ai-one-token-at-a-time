<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 254" role="img" aria-label="Filigrana e provenienza offrono informazioni sull'origine, mentre il rilevatore fornisce una stima che richiede ulteriori verifiche."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fadede;stroke:#e03131;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#e03131}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#e03131;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#e03131}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-provenance" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-mod" x="20" y="30" width="142" height="44" rx="6"/><text class="t-sm mid it" x="91" y="57">Filigrana</text><text class="t-sm mid en" x="91" y="57">Watermark</text><line class="ln" x1="170" y1="52" x2="218" y2="52" marker-end="url(#ah-provenance)"/><rect class="box" x="228" y="30" width="162" height="44" rx="6"/><text class="t-sm mid it" x="309" y="57">Segnale inserito</text><text class="t-sm mid en" x="309" y="57">Embedded signal</text><line class="ln" x1="398" y1="52" x2="435" y2="52" marker-end="url(#ah-provenance)"/><rect class="box-mod" x="20" y="108" width="142" height="44" rx="6"/><text class="t-sm mid it" x="91" y="135">Provenienza</text><text class="t-sm mid en" x="91" y="135">Provenance</text><line class="ln" x1="170" y1="130" x2="218" y2="130" marker-end="url(#ah-provenance)"/><rect class="box" x="228" y="108" width="162" height="44" rx="6"/><text class="t-sm mid it" x="309" y="135">Storia firmata</text><text class="t-sm mid en" x="309" y="135">Signed history</text><line class="ln" x1="398" y1="130" x2="435" y2="130" marker-end="url(#ah-provenance)"/><rect class="box-mod" x="20" y="186" width="142" height="44" rx="6"/><text class="t-sm mid it" x="91" y="213">Rilevatore</text><text class="t-sm mid en" x="91" y="213">Detector</text><line class="ln" x1="170" y1="208" x2="218" y2="208" marker-end="url(#ah-provenance)"/><rect class="box" x="228" y="186" width="162" height="44" rx="6"/><text class="t-sm mid it" x="309" y="213">Stima statistica</text><text class="t-sm mid en" x="309" y="213">Statistical estimate</text><line class="ln" x1="398" y1="208" x2="435" y2="208" marker-end="url(#ah-provenance)"/><rect class="box-accent" x="445" y="30" width="95" height="200" rx="6"/><text class="t-sm mid it" x="493" y="108">Verifica</text><text class="t-sm mid en" x="493" y="108">Check</text><text class="t-sm mid it" x="493" y="132">fonte</text><text class="t-sm mid en" x="493" y="132">source</text><text class="t-xs mid it" x="493" y="156">e contesto</text><text class="t-xs mid en" x="493" y="156">and context</text></svg>
