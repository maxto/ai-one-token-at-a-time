<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 233" role="img" aria-label="L'inpainting modifica una zona interna selezionata, mentre l'outpainting genera nuove zone oltre il bordo originale."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fadede;stroke:#e03131;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#e03131}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#e03131;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#e03131}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-image-editing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm mid" x="145" y="26">Inpainting</text><text class="t-sm mid" x="421" y="26">Outpainting</text><rect class="box" x="45" y="49" width="200" height="136" rx="6"/><line class="ln-muted" x1="57" y1="146" x2="233" y2="146"/><rect class="box-accent" x="111" y="80" width="69" height="63" rx="6"/><text class="t-sm mid it" x="145" y="111">Zona</text><text class="t-sm mid en" x="145" y="111">Edit</text><text class="t-sm mid it" x="145" y="129">da rifare</text><text class="t-sm mid en" x="145" y="129">area</text><text class="t-sm mid it" x="145" y="211">Selezione interna</text><text class="t-sm mid en" x="145" y="211">Interior selection</text><rect class="box-accent" x="313" y="49" width="220" height="136" rx="6"/><rect class="box" x="353" y="69" width="140" height="96" rx="6"/><line class="ln-muted" x1="365" y1="144" x2="481" y2="144"/><text class="t-sm mid it" x="423" y="110">Originale</text><text class="t-sm mid en" x="423" y="110">Original</text><text class="t-sm mid it" x="423" y="211">Nuovo bordo esterno</text><text class="t-sm mid en" x="423" y="211">New outer area</text></svg>
