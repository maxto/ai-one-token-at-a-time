<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" role="img" aria-label="Il riferimento di aspetto e stile e la guida di posa entrano nella generazione insieme al prompt."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fadede;stroke:#e03131;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#e03131}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#e03131;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#e03131}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-reference-images" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-mod" x="20" y="25" width="168" height="58" rx="6"/><text class="t-sm mid it" x="104" y="49">Aspetto e stile</text><text class="t-sm mid en" x="104" y="49">Appearance / style</text><text class="t-xs mid it" x="104" y="69">Riferimento</text><text class="t-xs mid en" x="104" y="69">Reference</text><rect class="box" x="20" y="133" width="168" height="58" rx="6"/><text class="t-sm mid it" x="104" y="157">Posa</text><text class="t-sm mid en" x="104" y="157">Pose</text><text class="t-xs mid it" x="104" y="177">Guida strutturale</text><text class="t-xs mid en" x="104" y="177">Structure guide</text><rect class="box-accent" x="232" y="80" width="144" height="56" rx="6"/><text class="t-sm mid it" x="304" y="113">Generazione</text><text class="t-sm mid en" x="304" y="113">Generation</text><line class="ln" x1="195" y1="55" x2="227" y2="94" marker-end="url(#ah-reference-images)"/><line class="ln" x1="195" y1="162" x2="227" y2="124" marker-end="url(#ah-reference-images)"/><rect class="box" x="240" y="187" width="128" height="36" rx="6"/><text class="t-sm mid" x="304" y="210">Prompt</text><line class="ln" x1="304" y1="179" x2="304" y2="143" marker-end="url(#ah-reference-images)"/><line class="ln" x1="383" y1="108" x2="414" y2="108" marker-end="url(#ah-reference-images)"/><rect class="box" x="423" y="72" width="117" height="73" rx="6"/><text class="t-sm mid it" x="481" y="103">Nuova</text><text class="t-sm mid en" x="481" y="103">New</text><text class="t-sm mid it" x="481" y="123">immagine</text><text class="t-sm mid en" x="481" y="123">image</text></svg>
