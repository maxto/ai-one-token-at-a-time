<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 246" role="img" aria-label="La tazza mantiene il manico nei primi fotogrammi, ma lo cambia nell'ultimo: un esempio di incoerenza nel tempo."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fadede;stroke:#e03131;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#e03131}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#e03131;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#e03131}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-video-generation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><text class="t-sm mid it" x="280" y="27">Stesso oggetto nel tempo</text><text class="t-sm mid en" x="280" y="27">Same object over time</text><rect class="box" x="20" y="49" width="140" height="115" rx="6"/><text class="t-sm mid" x="90" y="191">t1</text><rect class="box-mod" x="60" y="78" width="48" height="57" rx="3"/><path class="ln" d="M108,88 h12 q20,20 0,35 h-12"/><line class="ln" x1="169" y1="107" x2="199" y2="107" marker-end="url(#ah-video-generation)"/><rect class="box" x="210" y="49" width="140" height="115" rx="6"/><text class="t-sm mid" x="280" y="191">t2</text><rect class="box-mod" x="250" y="78" width="48" height="57" rx="3"/><path class="ln" d="M298,88 h12 q20,20 0,35 h-12"/><line class="ln" x1="359" y1="107" x2="389" y2="107" marker-end="url(#ah-video-generation)"/><rect class="box-accent" x="400" y="49" width="140" height="115" rx="6"/><text class="t-sm mid" x="470" y="191">t3</text><rect class="box-mod" x="440" y="78" width="48" height="57" rx="3"/><path class="ln" d="M440,88 h-12 q-20,20 0,35 h12"/><text class="t-sm mid it" x="280" y="225">Il manico cambia lato</text><text class="t-sm mid en" x="280" y="225">The handle switches sides</text></svg>
