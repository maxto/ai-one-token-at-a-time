<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Il riconoscimento produce una trascrizione dall'audio, mentre la sintesi genera nuovo audio dal testo, eventualmente guidata da una voce di riferimento."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#fadede;stroke:#e03131;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#e03131}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#e03131;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#e03131}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-speech" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box" x="20" y="43" width="116" height="44" rx="6"/><text class="t-sm mid it" x="78" y="70">Audio originale</text><text class="t-sm mid en" x="78" y="70">Original audio</text><line class="ln" x1="144" y1="65" x2="204" y2="65" marker-end="url(#ah-speech)"/><text class="t-sm mid it" x="281" y="28">Riconoscimento</text><text class="t-sm mid en" x="281" y="28">Recognition</text><rect class="box-mod" x="213" y="43" width="137" height="44" rx="6"/><text class="t-sm mid it" x="281" y="70">Trascrizione</text><text class="t-sm mid en" x="281" y="70">Transcript</text><line class="ln" x1="359" y1="65" x2="410" y2="65" marker-end="url(#ah-speech)"/><rect class="box" x="420" y="43" width="118" height="44" rx="6"/><text class="t-sm mid it" x="479" y="70">Testo</text><text class="t-sm mid en" x="479" y="70">Text</text><line class="ln-muted" x1="479" y1="91" x2="479" y2="164"/><line class="ln" x1="479" y1="164" x2="356" y2="164" marker-end="url(#ah-speech)"/><text class="t-sm mid it" x="281" y="124">Sintesi</text><text class="t-sm mid en" x="281" y="124">Synthesis</text><rect class="box-accent" x="213" y="142" width="137" height="44" rx="6"/><text class="t-sm mid it" x="281" y="169">Nuovo audio</text><text class="t-sm mid en" x="281" y="169">New audio</text><rect class="box" x="20" y="211" width="152" height="38" rx="6"/><text class="t-sm mid it" x="96" y="235">Voce di riferimento</text><text class="t-sm mid en" x="96" y="235">Reference voice</text><path class="ln dash" d="M180,230 L281,230 L281,193" marker-end="url(#ah-speech)"/><text class="t-xs mid it" x="96" y="191">Opzionale</text><text class="t-xs mid en" x="96" y="191">Optional</text></svg>
