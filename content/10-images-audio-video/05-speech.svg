<svg viewBox="0 0 560 270" role="img" aria-label="Il riconoscimento produce una trascrizione dall'audio, mentre la sintesi genera nuovo audio dal testo, eventualmente guidata da una voce di riferimento.">
<defs>
<marker id="ah-speech" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
</defs>
<rect class="box" x="20" y="43" width="116" height="44" rx="6"/>
<text class="t-sm mid it" x="78" y="70">Audio originale</text>
<text class="t-sm mid en" x="78" y="70">Original audio</text>
<line class="ln" x1="144" y1="65" x2="204" y2="65" marker-end="url(#ah-speech)"/>
<text class="t-sm mid it" x="281" y="28">Riconoscimento</text>
<text class="t-sm mid en" x="281" y="28">Recognition</text>
<rect class="box-mod" x="213" y="43" width="137" height="44" rx="6"/>
<text class="t-sm mid it" x="281" y="70">Trascrizione</text>
<text class="t-sm mid en" x="281" y="70">Transcript</text>
<line class="ln" x1="359" y1="65" x2="410" y2="65" marker-end="url(#ah-speech)"/>
<rect class="box" x="420" y="43" width="118" height="44" rx="6"/>
<text class="t-sm mid it" x="479" y="70">Testo</text>
<text class="t-sm mid en" x="479" y="70">Text</text>
<line class="ln-muted" x1="479" y1="91" x2="479" y2="164"/>
<line class="ln" x1="479" y1="164" x2="356" y2="164" marker-end="url(#ah-speech)"/>
<text class="t-sm mid it" x="281" y="124">Sintesi</text>
<text class="t-sm mid en" x="281" y="124">Synthesis</text>
<rect class="box-accent" x="213" y="142" width="137" height="44" rx="6"/>
<text class="t-sm mid it" x="281" y="169">Nuovo audio</text>
<text class="t-sm mid en" x="281" y="169">New audio</text>
<rect class="box" x="20" y="211" width="152" height="38" rx="6"/>
<text class="t-sm mid it" x="96" y="235">Voce di riferimento</text>
<text class="t-sm mid en" x="96" y="235">Reference voice</text>
<path class="ln dash" d="M180,230 L281,230 L281,193" marker-end="url(#ah-speech)"/>
<text class="t-xs mid it" x="96" y="191">Opzionale</text>
<text class="t-xs mid en" x="96" y="191">Optional</text>
</svg>
