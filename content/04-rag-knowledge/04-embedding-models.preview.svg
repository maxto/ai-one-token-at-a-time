<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 214" role="img" aria-label="Il modello trasforma ogni testo in un vettore: frasi con lo stesso significato finiscono vicine anche senza parole in comune."><rect width="100%" height="100%" fill="#fff"/><style>
