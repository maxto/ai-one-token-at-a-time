ht="40" rx="6"/><text class="t mid" x="487" y="175">Prompt</text><line class="ln" x1="487" y1="190" x2="487" y2="226" marker-end="url(#ah-retrieval-pipelines)"/><rect class="box" x="430" y="228" width="114" height="40" rx="6"/><text class="t mid it" x="487" y="253">Risposta</text><text class="t mid en" x="487" y="253">Answer</text><text class="t-xs it" x="16" y="214">Il prompt contiene</text><text class="t-xs en" x="16" y="214">The prompt holds</text><text class="t-xs it" x="16" y="232">domanda + chunk</text><text class="t-xs en" x="16" y="232">question + chunks</text></svg>
