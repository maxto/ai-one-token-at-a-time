<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="Testi simili sono punti vicini: il database restituisce i punti più vicini alla domanda, senza controllarli tutti."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#dff3e3;stroke:#37b24d;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#37b24d}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#37b24d;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#37b24d}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-vector-databases" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-soft" x="16" y="20" width="320" height="200" rx="8"/><circle class="ln-accent dash" cx="108" cy="92" r="34"/><line class="ln-accent" x1="108" y1="92" x2="130" y2="96"/><line class="ln-accent" x1="108" y1="92" x2="96" y2="112"/><line class="ln-accent" x1="108" y1="92" x2="110" y2="64"/><circle class="fill-mod" cx="62" cy="78" r="5"/><circle class="fill-mod" cx="70" cy="124" r="5"/><circle class="fill-mod" cx="130" cy="96" r="5"/><circle class="fill-mod" cx="96" cy="112" r="5"/><circle class="fill-mod" cx="110" cy="64" r="5"/><circle class="fill-accent" cx="108" cy="92" r="7"/><text class="t-xs t-accent it" x="150" y="80">domanda</text><text class="t-xs t-accent en" x="150" y="80">query</text><text class="t-xs mid it" x="100" y="156">cucina</text><text class="t-xs mid en" x="100" y="156">cooking</text><circle class="fill-muted" cx="240" cy="60" r="5"/><circle class="fill-muted" cx="272" cy="50" r="5"/><circle class="fill-muted" cx="290" cy="84" r="5"/><circle class="fill-muted" cx="252" cy="94" r="5"/><text class="t-xs mid" x="266" y="120">sport</text><circle class="fill-muted" cx="196" cy="168" r="5"/><circle class="fill-muted" cx="232" cy="158" r="5"/><circle class="fill-muted" cx="256" cy="182" r="5"/><circle class="fill-muted" cx="214" cy="190" r="5"/><text class="t-xs it" x="272" y="166">viaggi</text><text class="t-xs en" x="272" y="166">travel</text><text class="t-sm t-b it" x="360" y="44">I 3 più vicini</text><text class="t-sm t-b en" x="360" y="44">3 nearest</text><rect class="box-mod" x="360" y="56" width="184" height="34" rx="6"/><text class="t-sm it" x="374" y="78">Pasta al forno</text><text class="t-sm en" x="374" y="78">Baked pasta</text><rect class="box-mod" x="360" y="98" width="184" height="34" rx="6"/><text class="t-sm it" x="374" y="120">Sugo di pomodoro</text><text class="t-sm en" x="374" y="120">Tomato sauce</text><rect class="box-mod" x="360" y="140" width="184" height="34" rx="6"/><text class="t-sm" x="374" y="162">Lasagne</text><text class="t-xs it" x="360" y="200">ANN salta quasi tutti i punti</text><text class="t-xs en" x="360" y="200">ANN skips most points</text></svg>
