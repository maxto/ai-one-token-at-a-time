<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Una pagina a due colonne, letta riga per riga attraverso le colonne, diventa testo mescolato, e l'errore può passare ai chunk, alla ricerca e alla risposta."><rect width="100%" height="100%" fill="#fff"/><style>
