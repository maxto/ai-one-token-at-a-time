<text class="t-xs mid en" x="280" y="194">tampers with check</text>
<rect class="box" x="430" y="88" width="110" height="54" rx="6"/>
<text class="t mid it" x="485" y="111">Controllo</text>
<text class="t mid en" x="485" y="111">Check</text>
<text class="t-xs mid it" x="485" y="130">✓ premio</text>
<text class="t-xs mid en" x="485" y="130">✓ reward</text>
<line class="ln" x1="130" y1="104" x2="198" y2="58" marker-end="url(#ah-reward-hacking)"/>
<line class="ln" x1="130" y1="126" x2="198" y2="172" marker-end="url(#ah-reward-hacking)"/>
<line class="ln" x1="360" y1="58" x2="428" y2="104" marker-end="url(#ah-reward-hacking)"/>
<line class="ln" x1="360" y1="172" x2="428" y2="126" marker-end="url(#ah-reward-hacking)"/>
</svg>
