<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 158" role="img" aria-label="L'RLHF passa da un reward model e dall'apprendimento per rinforzo; la DPO usa le stesse preferenze per aggiornare il modello direttamente."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#f8dee7;stroke:#d6336c;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#d6336c}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#d6336c;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#d6336c}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-dpo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-dpo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><g transform="translate(0,-22)"><text class="t t-b" x="20" y="68">RLHF</text><text class="t t-b" x="20" y="148">DPO</text><rect class="box" x="80" y="45" width="100" height="36" rx="6"/><text class="t-sm mid it" x="130" y="68">Preferenze</text><text class="t-sm mid en" x="130" y="68">Preferences</text><rect class="box-mod" x="450" y="45" width="100" height="36" rx="6"/><text class="t-sm mid it" x="500" y="68">Modello</text><text class="t-sm mid en" x="500" y="68">Model</text><rect class="box" x="80" y="125" width="100" height="36" rx="6"/><text class="t-sm mid it" x="130" y="148">Preferenze</text><text class="t-sm mid en" x="130" y="148">Preferences</text><rect class="box-mod" x="450" y="125" width="100" height="36" rx="6"/><text class="t-sm mid it" x="500" y="148">Modello</text><text class="t-sm mid en" x="500" y="148">Model</text><line class="ln" x1="180" y1="63" x2="206" y2="63" marker-end="url(#ah-dpo)"/><rect class="box-soft" x="210" y="45" width="110" height="36" rx="6"/><text class="t-sm mid" x="265" y="68">Reward model</text><line class="ln" x1="320" y1="63" x2="346" y2="63" marker-end="url(#ah-dpo)"/><rect class="box-soft" x="350" y="45" width="70" height="36" rx="6"/><text class="t-sm mid" x="385" y="68">RL</text><line class="ln" x1="420" y1="63" x2="446" y2="63" marker-end="url(#ah-dpo)"/><line class="ln-accent" stroke-width="2" x1="180" y1="143" x2="446" y2="143" marker-end="url(#ah2-dpo)"/><text class="t-sm t-accent mid it" x="315" y="133">aggiornamento diretto</text><text class="t-sm t-accent mid en" x="315" y="133">direct update</text><text class="t-xs mid it" x="315" y="162">rispetto a una copia congelata</text><text class="t-xs mid en" x="315" y="162">measured against a frozen copy</text></g></svg>
