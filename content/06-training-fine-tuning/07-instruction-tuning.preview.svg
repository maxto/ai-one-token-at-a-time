<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img" aria-label="Alla stessa richiesta il modello base continua il testo, quello dopo l'instruction tuning risponde."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#f8dee7;stroke:#d6336c;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#d6336c}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#d6336c;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#d6336c}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-instruction-tuning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-instruction-tuning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><rect class="box-soft" x="20" y="16" width="520" height="36" rx="6"/><text class="t t-mono mid it" x="280" y="39">Elenca tre capitali europee</text><text class="t t-mono mid en" x="280" y="39">List three European capitals</text><line class="ln" x1="145" y1="56" x2="145" y2="78" marker-end="url(#ah-instruction-tuning)"/><line class="ln" x1="415" y1="56" x2="415" y2="78" marker-end="url(#ah-instruction-tuning)"/><text class="t-sm t-b mid it" x="145" y="98">Modello base</text><text class="t-sm t-b mid en" x="145" y="98">Base model</text><text class="t-sm t-b mid it" x="415" y="98">Dopo instruction tuning</text><text class="t-sm t-b mid en" x="415" y="98">After instruction tuning</text><rect class="box" x="20" y="108" width="250" height="60" rx="6"/><text class="t-sm t-mono it" x="34" y="133">Elenca tre fiumi europei.</text><text class="t-sm t-mono en" x="34" y="133">List three European rivers.</text><text class="t-sm t-mono it" x="34" y="153">Elenca tre monti…</text><text class="t-sm t-mono en" x="34" y="153">List three mountains…</text><rect class="box-accent" x="290" y="108" width="250" height="60" rx="6"/><text class="t-sm t-mono mid it" x="415" y="143">Parigi, Roma, Berlino.</text><text class="t-sm t-mono mid en" x="415" y="143">Paris, Rome, Berlin.</text><text class="t-xs mid it" x="145" y="188">continua il testo</text><text class="t-xs mid en" x="145" y="188">continues the text</text><text class="t-xs mid it" x="415" y="188">segue l'istruzione</text><text class="t-xs mid en" x="415" y="188">follows the instruction</text></svg>
