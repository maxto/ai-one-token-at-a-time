<svg viewBox="0 0 560 158" role="img" aria-label="L'RLHF passa da un reward model e dall'apprendimento per rinforzo, mentre la DPO usa le stesse preferenze per aggiornare il modello direttamente.">
<defs>
<marker id="ah-dpo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
<marker id="ah2-dpo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-accent"/>
</marker>
</defs>
<g transform="translate(0,-22)">
<text class="t t-b" x="20" y="68">RLHF</text>
<text class="t t-b" x="20" y="148">DPO</text>
<rect class="box" x="80" y="45" width="100" height="36" rx="6"/>
<text class="t-sm mid it" x="130" y="68">Preferenze</text>
<text class="t-sm mid en" x="130" y="68">Preferences</text>
<rect class="box-mod" x="450" y="45" width="100" height="36" rx="6"/>
<text class="t-sm mid it" x="500" y="68">Modello</text>
<text class="t-sm mid en" x="500" y="68">Model</text>
<rect class="box" x="80" y="125" width="100" height="36" rx="6"/>
<text class="t-sm mid it" x="130" y="148">Preferenze</text>
<text class="t-sm mid en" x="130" y="148">Preferences</text>
<rect class="box-mod" x="450" y="125" width="100" height="36" rx="6"/>
<text class="t-sm mid it" x="500" y="148">Modello</text>
<text class="t-sm mid en" x="500" y="148">Model</text>
<line class="ln" x1="180" y1="63" x2="206" y2="63" marker-end="url(#ah-dpo)"/>
<rect class="box-soft" x="210" y="45" width="110" height="36" rx="6"/>
<text class="t-sm mid" x="265" y="68">Reward model</text>
<line class="ln" x1="320" y1="63" x2="346" y2="63" marker-end="url(#ah-dpo)"/>
<rect class="box-soft" x="350" y="45" width="70" height="36" rx="6"/>
<text class="t-sm mid" x="385" y="68">RL</text>
<line class="ln" x1="420" y1="63" x2="446" y2="63" marker-end="url(#ah-dpo)"/>
<line class="ln-accent" stroke-width="2" x1="180" y1="143" x2="446" y2="143" marker-end="url(#ah2-dpo)"/>
<text class="t-sm t-accent mid it" x="315" y="133">aggiornamento diretto</text>
<text class="t-sm t-accent mid en" x="315" y="133">direct update</text>
<text class="t-xs mid it" x="315" y="162">rispetto a una copia congelata</text>
<text class="t-xs mid en" x="315" y="162">measured against a frozen copy</text>
</g>
</svg>
