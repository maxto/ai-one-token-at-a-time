<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="La grande matrice W resta congelata: si allenano solo due matrici sottili, B e A, il cui prodotto si somma a W."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#f8dee7;stroke:#d6336c;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#d6336c}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#d6336c;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#d6336c}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-lora-qlora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-lora-qlora" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><text class="t t-mono mid" x="288" y="26">W + B·A</text><rect class="box-soft" x="100" y="44" width="140" height="140" rx="4"/><text class="t t-b mid" x="170" y="119">W</text><text class="t mid" x="270" y="119">+</text><rect class="box-accent" x="300" y="44" width="24" height="140" rx="4"/><text class="t t-b mid" x="312" y="119">B</text><rect class="box-accent" x="336" y="102" width="140" height="24" rx="4"/><text class="t t-b mid" x="406" y="119">A</text><text class="t-sm mid it" x="170" y="206">congelata</text><text class="t-sm mid en" x="170" y="206">frozen</text><text class="t-sm mid it" x="388" y="206">allenate (rango r)</text><text class="t-sm mid en" x="388" y="206">trained (rank r)</text></svg>
