<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 242" role="img" aria-label="Una traccia mostra i passi di una singola richiesta nel tempo e rivela quale passo rallenta o sbaglia."><rect width="100%" height="100%" fill="#fff"/><style>
