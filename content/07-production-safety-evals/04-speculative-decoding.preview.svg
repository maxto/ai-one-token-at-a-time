d en" x="364" y="149">the</text><rect class="box-accent" x="416" y="128" width="88" height="32" rx="6"/><text class="t mid it" x="460" y="149">di</text><text class="t mid en" x="460" y="149">sofa</text><text class="t-xs mid it" x="268" y="180">accettati</text><text class="t-xs mid en" x="268" y="180">kept</text><text class="t-xs t-accent mid it" x="460" y="180">scelto dal grande</text><text class="t-xs t-accent mid en" x="460" y="180">large model's pick</text></svg>
