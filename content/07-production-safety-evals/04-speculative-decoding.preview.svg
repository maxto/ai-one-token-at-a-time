<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 192" role="img" aria-label="Il modello piccolo propone quattro token, il grande li verifica in un solo passaggio, ne accetta tre e sostituisce il quarto con il suo."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
