<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" role="img" aria-label="Con lo stesso prefisso il calcolo viene riletto dalla cache, mentre una data messa in testa cambia il prefisso e obbliga a ricalcolare tutto."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
