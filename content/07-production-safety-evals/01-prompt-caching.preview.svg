ss="t mid it" x="474" y="191">Domanda C</text><text class="t mid en" x="474" y="191">Question C</text><text class="t-xs it" x="120" y="224">prefisso cambiato: tutto ricalcolato</text><text class="t-xs en" x="120" y="224">prefix changed: all recomputed</text></svg>
