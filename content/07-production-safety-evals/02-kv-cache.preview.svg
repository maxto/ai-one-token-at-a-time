<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 156" role="img" aria-label="A ogni passo si calcolano key e value solo del token nuovo, che si confronta con quelli già in cache."><rect width="100%" height="100%" fill="#fff"/><style>
