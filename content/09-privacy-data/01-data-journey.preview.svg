</style><defs><marker id="ah-data-journey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker></defs><rect class="box-soft" x="196" y="16" width="348" height="168" rx="6"/><rect class="box" x="20" y="72" width="110" height="50" rx="6"/><text class="t-sm mid it" x="75" y="102">dispositivo</text><text class="t-sm mid en" x="75" y="102">your device</text><line class="ln" x1="134" y1="97" x2="212" y2="97" marker-end="url(#ah-data-journey)"/><text class="t-xs mid it" x="165" y="86">cifrato</text><text class="t-xs mid en" x="165" y="86">encrypted</text><text class="t-xs mid" x="165" y="116">TLS</text><text class="t-xs it" x="208" y="36">servizio nel cloud</text><text class="t-xs en" x="208" y="36">cloud service</text><rect class="box-accent" x="216" y="72" width="110" height="50" rx="6"/><text class="t mid it" x="271" y="102">modello</text><text class="t mid en" x="271" y="102">model</text><text class="t-xs mid it" x="271" y="142">legge in chiaro</text><text class="t-xs mid en" x="271" y="142">reads plain text</text><line class="ln" x1="330" y1="97" x2="380" y2="58" marker-end="url(#ah-data-journey)"/><line class="ln" x1="330" y1="97" x2="380" y2="102" marker-end="url(#ah-data-journey)"/><line class="ln-muted dash" x1="330" y1="97" x2="380" y2="146" marker-end="url(#ah-data-journey)"/><rect class="box" x="384" y="42" width="144" height="32" rx="6"/><text class="t-sm mid it" x="456" y="63">cronologia</text><text class="t-sm mid en" x="456" y="63">history</text><rect class="box" x="384" y="86" width="144" height="32" rx="6"/><text class="t-sm mid it" x="456" y="107">registri tecnici</text><text class="t-sm mid en" x="456" y="107">technical logs</text><rect class="box dash" x="384" y="130" width="144" height="32" rx="6"/><text class="t-sm mid it" x="456" y="151">addestramento?</text><text class="t-sm mid en" x="456" y="151">training?</text></svg>
