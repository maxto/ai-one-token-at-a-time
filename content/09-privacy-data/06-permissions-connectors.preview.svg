<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" role="img" aria-label="Ogni connettore apre solo le porte che autorizzi: leggere è un permesso, inviare o modificare è un altro, più rischioso."><rect width="100%" height="100%" fill="#fff"/><style>
