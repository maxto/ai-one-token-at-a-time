<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 206" role="img" aria-label="Dopo l'eliminazione la chat visibile sparisce subito, backup e registri scadono più tardi, mentre ciò che è finito nei pesi del modello resta."><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.en{display:none}
.box{fill:#fff;stroke:#aeb6c6;stroke-width:1.5}.box-soft{fill:#eef0f5}.box-accent{fill:#edf2ff;stroke:#3b5bdb;stroke-width:1.5}
.box-mod{fill:#d8f1e9;stroke:#0ca678;stroke-width:1.5}.fill-accent{fill:#3b5bdb}.fill-mod{fill:#0ca678}.fill-muted{fill:#6f7689}.fill-ink{fill:#464d5e}.fill-soft{fill:#eef0f5}
.ln,.ln-muted,.ln-accent,.ln-mod{fill:none}.ln{stroke:#464d5e;stroke-width:1.5}.ln-muted{stroke:#6f7689;stroke-width:1.5}.ln-accent{stroke:#3b5bdb;stroke-width:2}.ln-mod{stroke:#0ca678;stroke-width:2}
.dash{stroke-dasharray:5 4}.t{font-size:15px;fill:#161a23}.t-sm{font-size:13px;fill:#464d5e}.t-xs{font-size:11.5px;fill:#6f7689}
.t-mono{font-family:ui-monospace,Consolas,monospace}.t-b{font-weight:700}.t-accent{fill:#3b5bdb}.t-mod{fill:#0ca678}.t-on{fill:#fff}.mid{text-anchor:middle}.end{text-anchor:end}
</style><defs><marker id="ah-retention-deletion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker><marker id="ah2-retention-deletion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-accent"/></marker></defs><line class="ln-muted dash" x1="260" y1="34" x2="260" y2="168"/><text class="t-xs t-b mid it" x="260" y="24">elimina</text><text class="t-xs t-b mid en" x="260" y="24">delete</text><text class="t-sm it" x="20" y="65">chat visibile</text><text class="t-sm en" x="20" y="65">visible chat</text><rect class="box-mod" x="160" y="48" width="100" height="24" rx="4"/><text class="t-xs it" x="270" y="64">sparisce</text><text class="t-xs en" x="270" y="64">gone</text><text class="t-sm it" x="20" y="105">backup e registri</text><text class="t-sm en" x="20" y="105">backups, logs</text><rect class="box-mod" x="160" y="88" width="220" height="24" rx="4"/><text class="t-xs it" x="390" y="104">scadono</text><text class="t-xs en" x="390" y="104">expire</text><text class="t-sm it" x="20" y="145">pesi del modello</text><text class="t-sm en" x="20" y="145">model weights</text><rect class="box-accent" x="160" y="128" width="356" height="24" rx="4"/><line class="ln-accent" x1="516" y1="140" x2="540" y2="140" marker-end="url(#ah2-retention-deletion)"/><text class="t-xs t-accent it" x="270" y="144">resta</text><text class="t-xs t-accent en" x="270" y="144">stays</text><line class="ln-muted" x1="160" y1="182" x2="540" y2="182" marker-end="url(#ah-retention-deletion)"/><text class="t-xs it" x="160" y="198">tempo</text><text class="t-xs en" x="160" y="198">time</text></svg>
