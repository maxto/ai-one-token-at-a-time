<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="Prima di inviare, i dati che non servono al compito vengono tolti o sostituiti con segnaposto, così al modello arriva solo il necessario."><rect width="100%" height="100%" fill="#fff"/><style>
