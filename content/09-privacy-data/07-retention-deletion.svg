<svg viewBox="0 0 560 206" role="img" aria-label="Dopo l'eliminazione la chat visibile sparisce subito, backup e registri scadono più tardi, mentre ciò che è finito nei pesi del modello resta.">
<defs>
<marker id="ah-retention-deletion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-ink"/>
</marker>
<marker id="ah2-retention-deletion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="fill-accent"/>
</marker>
</defs>
<line class="ln-muted dash" x1="260" y1="34" x2="260" y2="168"/>
<text class="t-xs t-b mid it" x="260" y="24">elimina</text>
<text class="t-xs t-b mid en" x="260" y="24">delete</text>
<text class="t-sm it" x="20" y="65">chat visibile</text>
<text class="t-sm en" x="20" y="65">visible chat</text>
<rect class="box-mod" x="160" y="48" width="100" height="24" rx="4"/>
<text class="t-xs it" x="270" y="64">sparisce</text>
<text class="t-xs en" x="270" y="64">gone</text>
<text class="t-sm it" x="20" y="105">backup e registri</text>
<text class="t-sm en" x="20" y="105">backups, logs</text>
<rect class="box-mod" x="160" y="88" width="220" height="24" rx="4"/>
<text class="t-xs it" x="390" y="104">scadono</text>
<text class="t-xs en" x="390" y="104">expire</text>
<text class="t-sm it" x="20" y="145">pesi del modello</text>
<text class="t-sm en" x="20" y="145">model weights</text>
<rect class="box-accent" x="160" y="128" width="356" height="24" rx="4"/>
<line class="ln-accent" x1="516" y1="140" x2="540" y2="140" marker-end="url(#ah2-retention-deletion)"/>
<text class="t-xs t-accent it" x="270" y="144">resta</text>
<text class="t-xs t-accent en" x="270" y="144">stays</text>
<line class="ln-muted" x1="160" y1="182" x2="540" y2="182" marker-end="url(#ah-retention-deletion)"/>
<text class="t-xs it" x="160" y="198">tempo</text>
<text class="t-xs en" x="160" y="198">time</text>
</svg>
